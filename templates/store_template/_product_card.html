{% load humanize %}
<div class="card product-card h-100">
  <a href="{% url 'store:product_detail' product.slug %}" class="card-img-wrap d-block">
    {% if product.image %}
      <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
    {% else %}
      <img src="https://placehold.co/400x300?text={{ product.name|urlencode }}" class="card-img-top" alt="{{ product.name }}">
    {% endif %}
  </a>
  <div class="card-body d-flex flex-column">
    <small class="text-muted">{{ product.brand }}</small>
    <h5 class="card-title"><a href="{% url 'store:product_detail' product.slug %}" class="text-decoration-none text-dark">{{ product.name }}</a></h5>
    <p class="product-price mb-3">₹{{ product.price|floatformat:0|intcomma }}</p>
    {% if product.in_stock %}
      <a href="#" class="btn btn-accent mt-auto add-to-cart">Add to Cart</a>
    {% else %}
      <span class="stock-badge mt-auto">Out of stock</span>
    {% endif %}
  </div>
</div>
