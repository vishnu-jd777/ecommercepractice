{% extends 'base.html' %}

{% block title %}Page not found{% endblock %}

{% block content %}
<div class="error-page text-center">
  <div class="error-code">404</div>
  <h2>Oops! This page doesn't exist</h2>
  <p class="text-muted">The link may be broken, or the product may have been removed.</p>
  <div class="error-actions">
    <a href="{% url 'store:home' %}" class="btn btn-primary">Back to Home</a>
    <a href="{% url 'store:product_list' %}" class="btn btn-outline-secondary">Browse Products</a>
  </div>
</div>
{% endblock %}
