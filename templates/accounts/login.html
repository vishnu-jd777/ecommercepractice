{% extends 'base.html' %}
{% block title %}Login | Electro Store{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card auth-card p-4">
      <h2 class="mb-4 text-center">Welcome back</h2>
      <form method="post" novalidate>
        {% csrf_token %}
        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors.0 }}</div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label" for="id_username">Username</label>
          <input type="text" name="username" id="id_username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="id_password">Password</label>
          <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        <button type="submit" class="btn btn-accent w-100">Log In</button>
      </form>
      <p class="text-center mt-3 mb-0">New here? <a href="{% url 'accounts:signup' %}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
